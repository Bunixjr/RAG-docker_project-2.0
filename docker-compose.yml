version: '3.8'

services:
  # Клиент RAG
  rag_app:
    build: .
    container_name: rag_client
    depends_on:
      - ollama  # сначала поднять Ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - C:\Users\Bunixjr\.cache\huggingface:/root/.cache/huggingface
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
    stdin_open: true # Разрешаем ввод с клавиатуры 
    tty: true # Красивый вывод в терминале

  # модуль ollama
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_server
    ports:
      - "11434:11434" # без этого тестировать было-бы нельзя
    volumes:
      - ./ollama_data:/root/.ollama # Сохраняем скачанные модели на компьютере